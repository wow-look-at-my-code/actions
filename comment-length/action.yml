name: comment-length
version: 1
description: Fail CI when a comment runs longer than the code it documents, over the source this change touched

inputs:
  slopfix:
    description: >-
      Path to the slopfix binary that carries the rule. The composite that
      wraps this action downloads it; a caller running the node action alone
      supplies its own.
    required: true

runs:
  using: node24
  main: dist/index.js
