name: ste-lint
version: 1
description: Check the prose a change touches against the mechanical subset of ASD-STE100 Simplified Technical English — sentence length measured over whole sentences rather than wrapped lines, contractions, banned modal verbs, semicolons, comma splices, hard-wrapped paragraphs, and dictionary word choice

inputs:
  files:
    description: 'Glob patterns to check, separated by whitespace or commas. The scope is then narrowed to the files this event changed. Matching nothing is a failure, never a quiet pass.'
    required: false
    default: '**/*.md'
  hard-max-words:
    description: 'A sentence longer than this fails. STE caps a sentence at 25 words, so a value above 25 is refused: it removes the rule rather than configuring it.'
    required: false
    default: '25'
  warn-max-words:
    description: 'A sentence longer than this warns. STE caps an instruction at 20 words. A value above 25 is refused, the same as hard-max-words.'
    required: false
    default: '20'

outputs:
  files:
    description: 'How many files were checked'
  violations:
    description: 'How many findings failed the run'

runs:
  using: node24
  main: dist/index.js
