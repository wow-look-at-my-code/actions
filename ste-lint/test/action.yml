name: Test ste-lint
version: 1
description: Dogfood ste-lint over this repo's prose (never released)

runs:
  using: composite
  steps:
    # ste-lint/fixtures/* break the rules on purpose, hence .md.fixture and this glob.
    - uses: ./ste-lint
      with:
        files: '*.md docs/*.md .github/workflows/*.md */README.md */CLAUDE.md'
