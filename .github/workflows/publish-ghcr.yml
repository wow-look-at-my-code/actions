name: Publish to GHCR

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Build artifact to download'
        required: false
        default: 'go-build'
        type: string
      artifact-path:
        description: 'Path to place downloaded artifact'
        required: false
        default: 'build'
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        default: 'Dockerfile'
        type: string
      context:
        description: 'Docker build context'
        required: false
        default: '.'
        type: string
      push-branch:
        description: 'Branch that triggers push (empty string to always push)'
        required: false
        default: 'master'
        type: string
      prune-keep:
        description: 'Tagged versions to keep when pruning (0 to disable)'
        required: false
        default: '10'
        type: string
      updater-webhook-url:
        description: 'docker-updater webhook URL to notify after push. Leave empty to skip.'
        required: false
        default: 'https://docker-updater-hook.pazer.io/'
        type: string
    secrets:
      updater-webhook-secret:
        description: 'Shared secret for signing the docker-updater webhook payload (HMAC-SHA256). Must match DOCKER_UPDATER_GITHUB_WEBHOOK_SECRET on the server.'
        required: false

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read # a private caller repo cannot be checked out without it
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify actions:read permission
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const res = await fetch(
              `https://api.github.com/repos/${github.repository}/actions/runs/${github.run_id}/artifacts`,
              { headers: { Authorization: `Bearer ${github.token}`, Accept: "application/vnd.github+json" } },
            );
            if (res.status === 403) {
              core.setFailed("Missing 'actions: read' permission — add it to your calling workflow's permissions block.");
            }

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - uses: wow-look-at-my/actions@typescript#latest
        id: meta
        env:
          PUSH_BRANCH: ${{ inputs.push-branch }}
        with:
          script: |
            const image = `ghcr.io/${github.repository.toLowerCase()}:latest`;
            const push = !env.PUSH_BRANCH || github.ref === `refs/heads/${env.PUSH_BRANCH}`;
            core.setOutput('image', image);
            core.setOutput('push', String(push));

      - uses: wow-look-at-my/actions@ghcr#latest
        with:
          token: ${{ github.token }}
          push_image: ${{ steps.meta.outputs.image }}
          push: ${{ steps.meta.outputs.push }}
          push_keep: ${{ inputs.prune-keep }}
          build_dockerfile: ${{ inputs.dockerfile }}
          build_context: ${{ inputs.context }}
          build_args: VERSION=${{ github.sha }}

      - name: Notify docker-updater
        if: steps.meta.outputs.push == 'true' && inputs.updater-webhook-url != ''
        env:
          UPDATER_URL: ${{ inputs.updater-webhook-url }}
          UPDATER_SECRET: ${{ secrets.updater-webhook-secret }}
        run: |
          PKG="${GITHUB_REPOSITORY##*/}"; PKG="${PKG,,}"
          NS="${GITHUB_REPOSITORY%%/*}";  NS="${NS,,}"
          BODY="{\"action\":\"published\",\"package\":{\"name\":\"$PKG\",\"namespace\":\"$NS\",\"package_type\":\"CONTAINER\"}}"
          [ -z "${UPDATER_SECRET:-}" ] && { echo "no updater secret; skipping"; exit 0; }
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$UPDATER_SECRET" | awk '{print $NF}')"
          curl -fsS -m 15 -X POST "$UPDATER_URL" \
            -H "X-GitHub-Event: package" \
            -H "X-Hub-Signature-256: $SIG" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY" \
            && echo "docker-updater triggered" \
            || echo "docker-updater trigger failed (non-fatal)"
