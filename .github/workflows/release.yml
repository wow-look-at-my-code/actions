name: Release Actions

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # Every suite, guard and dogfood run this repo does.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag-cleanup deletes orphaned release tags
      actions: write # cache-cleanup deletes entries; the all-builds guard lists jobs
      checks: read # the guard's check-runs layer must be able to run
    steps:
      - uses: actions/checkout@v4
      - uses: ./cache-rg/test
      # Toolchain only -- every node24 action this job runs is built below.
      - uses: ./.github/actions/setup-and-build
      # node24 actions: dist/ is not committed, so build before `uses: ./...`.
      - name: Build the typescript action, which builds the rest
        run: cd typescript && just build
      - name: Build the actions this job runs
        uses: ./typescript
        with:
          script: |
            const dirs = ['no-tests-in-yaml', 'no-scripts-action', 'tag-cleanup', 'no-all-builds-job',
              'ste-lint', 'cache-upload', 'cache-download', 'cache-cleanup', 'run-once',
              'orphan-release'];
            await Promise.all(dirs.map(dir => $`just build`.cwd(dir)));
      # This job runs every common-check below from THIS checkout, so it claims the once-per-run slot: otherwise a downstream action pulls in the PUBLISHED copy and the repo cannot publish a fix for its own check.
      - uses: ./run-once
        with:
          name: common-checks
      # One composite per action, in that action's folder: every test and dogfood step lives there.
      - uses: ./orphan-release/test
      - uses: ./secret-server/test
      - uses: ./no-all-builds-job/test
      - uses: ./no-tests-in-yaml/test
      - uses: ./ste-lint/test
      - uses: ./no-scripts-action/test
      - uses: ./tag-cleanup/test
      - uses: ./yaml-comment-block/test
      - uses: ./push-excludes-tags/test
      - uses: ./typescript/test
      - uses: ./_shared/cache-xfer/test

  # The shared cache-xfer tests on NT: its tar and path handling, and that a unix-origin hand-off runs there.
  cache-xfer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./_shared/cache-xfer/test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate action slugs
        run: |
          repo="${{ github.repository }}"
          errors=0

          # Correct: repo@action-name#ref. Wrong: repo/action-name@ref.
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            num=$(echo "$line" | cut -d: -f2)
            match=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
            slug=$(echo "$match" | grep -oP "(?<=${repo}/)[^@/]+" || true)
            echo "::error file=${file},line=${num}::Wrong action slug format '${slug}' — use ${repo}@${slug}#ref instead of ${repo}/${slug}@ref"
            errors=$((errors + 1))
          done < <(grep -rn "${repo}/[a-zA-Z0-9_-]*@" --include='*.yml' --include='*.yaml' --include='*.md' . || true)

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

      - name: Validate workflow YAML with action-validator
        uses: ./action-validator
        with:
          # A required input this step has no use for: release-node checks each action.yml.
          actions: 'no-such-dir/*/action.yml'
          workflows: '.github/workflows/*.yml'

  detect:
    # It enumerates every action rather than diffing, so a dispatch republishes the lot, which is what a recovery run wants.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      composite: ${{ steps.find.outputs.composite }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Skip */test/* — those are dogfood harnesses invoked from CI, not released actions.
          node() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ -f "$n/package.json" ] && echo "$n"
            done
          }
          composite() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ ! -f "$n/package.json" ] && echo "$n"
            done
          }
          echo "node=$(node | jq -R | jq -sc)" >> $GITHUB_OUTPUT
          echo "composite=$(composite | jq -R | jq -sc)" >> $GITHUB_OUTPUT

  release-node:
    needs: [checks, detect]
    # A push publishes only behind green checks. A manual dispatch publishes regardless, which is the operator escape hatch for a broken published action that gates its own replacement.
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.node != '[]' && (github.event_name == 'workflow_dispatch' || needs.checks.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect.outputs.node) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: ${{ matrix.action }}

      # Type-checks the project, then runs whatever test files it finds; none is a pass.
      - name: Test
        working-directory: ${{ matrix.action }}
        run: ts0 test

      - name: Validate action.yml
        run: |
          action="${{ matrix.action }}"
          main=$(yq '.runs.main' "$action/action.yml")
          if [ "$main" != "null" ] && [ -n "$main" ]; then
            if [ ! -f "$action/$main" ]; then
              echo "::error::$action/action.yml runs.main points to '$main' which does not exist"
              exit 1
            fi
          fi

          for field in pre post; do
            file=$(yq ".runs.$field" "$action/action.yml")
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              if [ ! -f "$action/$file" ]; then
                echo "::error::$action/action.yml runs.$field points to '$file' which does not exist"
                exit 1
              fi
            fi
          done

      - name: Validate JS files are parseable
        working-directory: ${{ matrix.action }}
        run: |
          for field in main pre post; do
            file=$(yq ".runs.$field" action.yml)
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              echo "Checking runs.$field: $file"
              node --check "$file"
            fi
          done

      # dist/ is not committed, and the matrix build above built the action under release, not this one.
      - name: Build the release tool
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        working-directory: orphan-release
        run: just build

      # The default branch, or a dispatch the operator started by hand. This is the only gate on publishing: the release tool publishes whatever it is asked to. Versions auto-increment and unchanged actions are skipped.
      - name: Create orphan tag
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node ./orphan-release/dist/index.js
          --source "${{ matrix.action }}"
          --exclude "src node_modules tsconfig.json ts0.json justfile package.json pnpm-lock.yaml pnpm-workspace.yaml"

  release-composite:
    needs: [checks, detect]
    # Same gate as release-node: green checks on a push, operator's word on a dispatch.
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.composite != '[]' && (github.event_name == 'workflow_dispatch' || needs.checks.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: orphan-release

      # Same gate as release-node: the default branch, or a hand-started dispatch.
      - name: Create orphan tags
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for action in $(echo '${{ needs.detect.outputs.composite }}' | jq -r '.[]'); do
            node ./orphan-release/dist/index.js --source "$action"
          done

